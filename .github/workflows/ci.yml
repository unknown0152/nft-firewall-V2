name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned analyzers
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
      - run: go mod verify
      - run: go mod tidy -diff
      - run: make fmt-check
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: make static
      - run: make vuln
      - run: make security
      - name: Shell analysis
        run: shellcheck scripts/*.sh tests/acceptance/*.sh tests/chaos/*.sh tests/namespaces/*.sh packaging/deb/preinst packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm

  package:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make deb VERSION=2.0.0+ci
      - run: sha256sum -c dist/SHA256SUMS
      - run: dpkg-deb --info dist/nft-firewall-v2_2.0.0+ci_amd64.deb
      - run: dpkg-deb --info dist/nft-firewall-v2_2.0.0+ci_arm64.deb
      - name: Verify static current-architecture executables
        run: |
          file dist/nftfw-linux-amd64 dist/nftfwd-linux-amd64 dist/nftfw-web-linux-amd64
          ! ldd dist/nftfw-linux-amd64
          ! ldd dist/nftfwd-linux-amd64
          ! ldd dist/nftfw-web-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: nft-firewall-v2-ci-packages
          path: |
            dist/*.deb
            dist/*-linux-*
            dist/SHA256SUMS

  privileged-namespace:
    if: ${{ vars.NFTFW_PRIVILEGED_RUNNER == 'enabled' }}
    runs-on: [self-hosted, linux, nftfw-privileged]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo ./tests/namespaces/run.sh
