name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned analyzers
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      - run: go mod verify
      - run: go mod tidy -diff
      - run: make fmt-check
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: make static
      - run: make vuln
      - run: make security
      - name: Shell analysis
        run: shellcheck scripts/*.sh packaging/initramfs/nftfw-ipv6-early packaging/initramfs/nftfw-udev-gate packaging/initramfs/nftfw-early-guard-hook packaging/initramfs/nftfw-initramfs-manage packaging/systemd/nftfw-setup-boot-hold-generator tests/*.sh tests/acceptance/*.sh tests/chaos/*.sh tests/namespaces/*.sh tests/packaging/*.sh tests/stage-r/*.sh packaging/deb/preinst packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm

  stage-r-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Unprivileged Stage R source and packaging contracts
        run: bash ./tests/stage-r/run.sh
      - name: Evidence boundary
        run: |
          echo "Stage R source contracts executed."
          echo "R2 privileged package/boot/network/Docker/OVPN evidence was not executed."

  package:
    runs-on: ubuntu-latest
    needs: [quality, stage-r-contracts]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make deb VERSION=2.1.0+ci COMMIT="$GITHUB_SHA" DISPOSITION=ci
      - run: ./tests/packaging/systemd_preflight.sh amd64
      - run: cd dist && sha256sum -c SHA256SUMS
      - run: dpkg-deb --info dist/nft-firewall-v2_2.1.0+ci_amd64.deb
      - run: dpkg-deb --info dist/nft-firewall-v2_2.1.0+ci_arm64.deb
      - name: Confirm CI packages remain non-release build artifacts
        run: |
          test "$(dpkg-deb -f dist/nft-firewall-v2_2.1.0+ci_amd64.deb X-NFTFW-Build-Disposition)" = ci
          test "$(dpkg-deb -f dist/nft-firewall-v2_2.1.0+ci_arm64.deb X-NFTFW-Build-Disposition)" = ci
      - name: Verify static current-architecture executables
        run: |
          file dist/nftfw-linux-amd64 dist/nftfwd-linux-amd64 dist/nftfw-web-linux-amd64
          ! ldd dist/nftfw-linux-amd64
          ! ldd dist/nftfwd-linux-amd64
          ! ldd dist/nftfw-web-linux-amd64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nft-firewall-v2-ci-packages
          path: |
            dist/*.deb
            dist/*-linux-*
            dist/SHA256SUMS

  stage-r2-privileged-namespace:
    if: ${{ vars.NFTFW_STAGE_R2_APPROVED == 'enabled' && vars.NFTFW_PRIVILEGED_RUNNER == 'enabled' }}
    runs-on: [self-hosted, linux, nftfw-privileged]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: sudo ./tests/namespaces/run.sh
