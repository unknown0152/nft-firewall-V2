name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l ./cmd ./internal)"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: make release VERSION=2.0.0-ci
      - run: sha256sum -c dist/SHA256SUMS
  privileged-namespace:
    if: ${{ false }}
    runs-on: [self-hosted, linux, nftfw-privileged]
    steps:
      - uses: actions/checkout@v4
      - run: sudo ./tests/namespaces/run.sh
