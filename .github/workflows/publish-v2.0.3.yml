name: publish-v2.0.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v2.0.3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v2.0.3
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'unknown0152/nft-firewall-V2'
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      RELEASE_COMMIT: e2b3fa0a20fa6e36325792397564966b21045120
      RELEASE_VERSION: 2.0.3
      RELEASE_BUILD_DATE: 2026-08-25T23:19:45Z
      SOURCE_DATE_EPOCH: 1787699985
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v2.0.3
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Verify release commit
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Verify annotated release tag
        run: |
          test "$(git cat-file -t refs/tags/v2.0.3)" = tag
          test "$(git rev-parse 'refs/tags/v2.0.3^{commit}')" = "$RELEASE_COMMIT"

      - name: Verify pinned Go toolchain
        run: |
          test "$(go env GOVERSION)" = go1.25.13

      - name: Verify clean release tree
        run: |
          test -z "$(git status --porcelain)"

      - name: Build exact release artifacts
        run: |
          make deb \
            VERSION="$RELEASE_VERSION" \
            COMMIT="$RELEASE_COMMIT" \
            BUILD_DATE="$RELEASE_BUILD_DATE" \
            DISPOSITION=release

      - name: Verify approved artifact bytes
        run: |
          cat > /tmp/nftfw-2.0.3-approved-sha256sums <<'SUMS'
          45c3fed2d131664d614e66782dffea352e10a3e22b4fa13fc6d1ab740c7f5b7a  dist/nft-firewall-v2_2.0.3_amd64.deb
          5831325cc5090bf03f6716dcf34233d78d35b632d9a39dec164e5d8e3d9c103f  dist/nft-firewall-v2_2.0.3_arm64.deb
          4b343946af6102c0dbf4f3ec3eb4167dacdcbc6e1aa01bb110381bbdf5c949b7  dist/nftfw-linux-amd64
          ff31652de3c347b072509faacc4b8d7463f02c093666cfb0cb7fcc41270d57be  dist/nftfw-linux-arm64
          3d86231440d5065ec8d856d4a1f831b3354b5797d8b18a427cf708d1184597e4  dist/nftfw-web-linux-amd64
          ba900aeeab7b92de104ac45d9332ee5e1f27a87501b3ecaf23584f27be658a0c  dist/nftfw-web-linux-arm64
          bc4fe384fbafbd4592cf6de019a865524124513e31a691f4d6d3671647db52eb  dist/nftfwd-linux-amd64
          c93cef462d166385c750ed1e6291290ff60103ba3bae6fbbaafc79fa96d2d9d1  dist/nftfwd-linux-arm64
          SUMS
          sha256sum -c /tmp/nftfw-2.0.3-approved-sha256sums
          sed 's#  dist/#  #' /tmp/nftfw-2.0.3-approved-sha256sums \
            > dist/NFTFW-2.0.3-SHA256SUMS

      - name: Create immutable GitHub release
        run: |
          if gh release view v2.0.3 >/dev/null 2>&1; then
            echo "GitHub release v2.0.3 already exists; refusing to replace it."
            exit 0
          fi
          cat > /tmp/nftfw-2.0.3-release-notes.md <<'NOTES'
          NFT Firewall V2 2.0.3 is the accepted provenance and dashboard
          status-contract release.

          Before installation, read the default branch's HOST-HANDOFF guide and
          run its read-only host preflight. Installation is inert and does not
          configure or start a VPN, activate NFTFW services, or apply policy.

          Release source:
          `e2b3fa0a20fa6e36325792397564966b21045120`

          Use the Debian package matching the target architecture and verify it
          with `NFTFW-2.0.3-SHA256SUMS`. Candidate, CI, and development artifacts
          are intentionally non-installable.

          Checksums are provided for integrity. This release does not currently
          include a cryptographic publisher signature.
          NOTES
          gh release create v2.0.3 \
            --verify-tag \
            --latest \
            --title "NFT Firewall V2 2.0.3" \
            --notes-file /tmp/nftfw-2.0.3-release-notes.md \
            dist/NFTFW-2.0.3-SHA256SUMS \
            dist/nft-firewall-v2_2.0.3_amd64.deb \
            dist/nft-firewall-v2_2.0.3_arm64.deb \
            dist/nftfw-linux-amd64 \
            dist/nftfw-linux-arm64 \
            dist/nftfwd-linux-amd64 \
            dist/nftfwd-linux-arm64 \
            dist/nftfw-web-linux-amd64 \
            dist/nftfw-web-linux-arm64
